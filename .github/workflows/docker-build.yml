name: Docker Build CI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/rag-backend:${{ env.IMAGE_TAG }} ./backend

      - name: Build Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/rag-frontend:${{ env.IMAGE_TAG }} ./frontend

      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/rag-backend:${{ env.IMAGE_TAG }}

      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/rag-frontend:${{ env.IMAGE_TAG }}

      - name: Update Helm Image Tag
        run: |
          sed -i "s/tag: .*/tag: ${{ env.IMAGE_TAG }}/" rag-chart/values.yaml

      - name: Commit Updated Helm Chart
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add rag-chart/values.yaml
          git commit -m "Updated image tag to ${{ env.IMAGE_TAG }}" || echo "No changes"

          git push